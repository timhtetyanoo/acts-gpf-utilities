# PG200, all events, 1 repetition, on the GPU, whichever version the checkout of build_cuda holds.
# Give each run its own name, which is its folder in results/:
#   scripts/run/run_finder.sh --config configs/cuda_pg200.conf --name <run name>
#   scripts/validation/run_validation.sh --config configs/cuda_pg200.conf --name <run name>
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cuda_pg200_all
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=all
GPF_REPETITIONS=1
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
