# PG0, all events, 3 repetitions, on the CPU.
# Give each run its own name, which is its folder in results/:
#   scripts/run/run_finder.sh --config configs/cpu_pg0.conf --name <run name>
#   scripts/validation/run_validation.sh --config configs/cpu_pg0.conf --name <run name>
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cpu_pg0_all
GPF_SAMPLE=PG0
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU0.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG0.json"
GPF_EVENTS=all
GPF_REPETITIONS=3
GPF_BACKEND=cpu
ACTS_BUILD_DIR="$HOME/cern/acts/build"
