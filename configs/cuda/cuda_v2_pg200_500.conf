# PG200, the first 500 events, 1 repetition, on the GPU, version 2.
# Compare with the CPU run of the same events, configs/cpu/cpu_pg200_500.conf.
# Step 1: scripts/run/run_finder.sh --config configs/cuda/cuda_v2_pg200_500.conf
# Step 2: scripts/validation/run_validation.sh --config configs/cuda/cuda_v2_pg200_500.conf
# Everything lands in results/cuda_v2_pg200_500/.
GPF_NAME=cuda_v2_pg200_500
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=500
GPF_REPETITIONS=1
GPF_BACKEND=cuda_v2
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
