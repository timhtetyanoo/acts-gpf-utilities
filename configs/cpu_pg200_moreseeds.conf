# PG200, 1000 events, 1 repetition, on the CPU, seeding from more hits:
# MDT hits seed too, and the inner station besides the middle and outer ones.
# Compare with the run of configs/cpu_pg200.conf to see what the extra seeds cost and gain.
# The build in ~/cern/acts/build runs whatever ~/cern/acts had checked out when it
# was built (~/cern/build.sh); run_info.txt records the revision a run used.
# Give each run its own name, which is its folder in results/:
#   scripts/run/run_finder.sh --config configs/cpu_pg200_moreseeds.conf --name <run name>
#   scripts/validation/run_validation.sh --config configs/cpu_pg200_moreseeds.conf --name <run name>
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cpu_pg200_moreseeds_1000
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=1000
GPF_REPETITIONS=1
GPF_BACKEND=cpu
ACTS_BUILD_DIR="$HOME/cern/acts/build"
GPF_SEED_FROM_MDT=1
GPF_SEED_FROM_INNER=1
