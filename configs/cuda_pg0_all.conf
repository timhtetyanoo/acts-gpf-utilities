# One run: PG0, all events, one repetition, on the GPU.
# Compare with the CPU run of the same events, configs/cpu_pg0_all.conf.
# Step 1: scripts/run/run_finder.sh --config configs/cuda_pg0_all.conf
# Step 2: scripts/validation/run_validation.sh --config configs/cuda_pg0_all.conf
# Everything lands in results/cuda_pg0_all/.
GPF_NAME=cuda_pg0_all
GPF_SAMPLE=PG0
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU0.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG0.json"
GPF_EVENTS=all
GPF_REPETITIONS=1
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
