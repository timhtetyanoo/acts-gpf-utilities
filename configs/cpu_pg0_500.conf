# One run: PG0, the first 500 events, three repetitions. A quick run to see how
# long an event takes before running configs/cpu_pg0_all.conf.
# Step 1: scripts/run/run_finder.sh --config configs/cpu_pg0_500.conf
# Step 2: scripts/validation/run_validation.sh --config configs/cpu_pg0_500.conf
# Everything lands in results/cpu_pg0_500/.
GPF_NAME=cpu_pg0_500
GPF_SAMPLE=PG0
GPF_EVENTS=500
GPF_REPETITIONS=3
ACTS_BUILD_DIR="$HOME/cern/acts/build"
