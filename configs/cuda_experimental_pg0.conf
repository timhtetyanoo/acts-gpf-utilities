# PG0, all events, 3 repetitions, on the GPU, the experimental version.
# The build in ~/cern/acts/build_cuda runs whatever ~/cern/acts has checked out: check
# out experimental (git switch --detach experimental while the ~/cern/acts-exp worktree holds the branch)
# and rebuild (~/cern/build_cuda.sh) first; run_info.txt records the revision a run used.
# Give each run its own name, which is its folder in results/:
#   scripts/run/run_finder.sh --config configs/cuda_experimental_pg0.conf --name <run name>
#   scripts/validation/run_validation.sh --config configs/cuda_experimental_pg0.conf --name <run name>
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cuda_experimental_pg0_all
GPF_SAMPLE=PG0
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU0.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG0.json"
GPF_EVENTS=all
GPF_REPETITIONS=3
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
