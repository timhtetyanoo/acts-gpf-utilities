# PG200, all events, 3 repetitions, on the CPU.
# The build in ~/cern/acts/build runs whatever ~/cern/acts has checked out: check
# out the CPU example, glob-pat-finder-example (cuda-glob-pat-finder-v2 holds it too)
# and rebuild (~/cern/build.sh) first; run_info.txt records the revision a run used.
# Give each run its own name, which is its folder in results/:
#   scripts/run/run_finder.sh --config configs/cpu_pg200.conf --name <run name>
#   scripts/validation/run_validation.sh --config configs/cpu_pg200.conf --name <run name>
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cpu_pg200_all
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=all
GPF_REPETITIONS=3
GPF_BACKEND=cpu
ACTS_BUILD_DIR="$HOME/cern/acts/build"
