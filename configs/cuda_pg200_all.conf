# One run: PG200, all events, three repetitions, on the GPU.
# Compare with the CPU run of the same events, configs/cpu_pg200_all.conf.
# Step 1: scripts/run/run_finder.sh --config configs/cuda_pg200_all.conf
# Step 2: scripts/validation/run_validation.sh --config configs/cuda_pg200_all.conf
# Everything lands in results/cuda_pg200_all/.
GPF_NAME=cuda_pg200_all
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=all
GPF_REPETITIONS=3
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
