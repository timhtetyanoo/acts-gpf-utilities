# One run: PG0, the first 500 events, one repetition, on the GPU.
# Compare with the CPU run of the same events, configs/cpu_pg0_500.conf.
# Step 1: scripts/run/run_finder.sh --config configs/cuda_pg0_500.conf
# Step 2: scripts/validation/run_validation.sh --config configs/cuda_pg0_500.conf
# Everything lands in results/cuda_pg0_500/.
GPF_NAME=cuda_pg0_500
GPF_SAMPLE=PG0
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU0.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG0.json"
GPF_EVENTS=500
GPF_REPETITIONS=1
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
