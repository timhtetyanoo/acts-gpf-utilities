# PG0, 1000 events, 1 repetition, on the GPU, seeding from more hits:
# MDT hits seed too, and the inner station besides the middle and outer ones.
# Compare with the run of configs/cuda_pg0.conf to see what the extra seeds cost and gain.
# The build in ~/cern/acts/build_cuda decides the version: it runs whatever
# ~/cern/acts had checked out when it was built (~/cern/build_cuda.sh). Name the
# run after it; run_info.txt records the revision a run used:
#   scripts/run/run_finder.sh --config configs/cuda_pg0_moreseeds.conf --name cuda_v2_pg0_moreseeds_1000
#   scripts/validation/run_validation.sh --config configs/cuda_pg0_moreseeds.conf --name cuda_v2_pg0_moreseeds_1000
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cuda_pg0_moreseeds_1000
GPF_SAMPLE=PG0
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU0.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG0.json"
GPF_EVENTS=1000
GPF_REPETITIONS=1
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
GPF_SEED_FROM_MDT=1
GPF_SEED_FROM_INNER=1
