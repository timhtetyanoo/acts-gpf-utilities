# Profile of the CPU finder: PG200, the first 500 events.
# Needs the profiling build: the gpf-profiling branch built with
# -DACTS_GPF_PROFILE (see scripts/profile/analyze_profile.py).
# Step 1: scripts/run/run_finder.sh --config configs/prof_pg200_500.conf
# The stages land in results/prof_pg200_500/profile/report.txt.
GPF_NAME=prof_pg200_500
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=500
GPF_REPETITIONS=1
GPF_PROFILE=1
ACTS_BUILD_DIR="$HOME/cern/acts-example/build_prof"
