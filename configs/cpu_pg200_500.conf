# One run: PG200, the first 500 events, three repetitions.
# Compare with the GPU run of the same events, configs/cuda_pg200_500.conf.
# Step 1: scripts/run/run_finder.sh --config configs/cpu_pg200_500.conf
# Step 2: scripts/validation/run_validation.sh --config configs/cpu_pg200_500.conf
# Everything lands in results/cpu_pg200_500/.
GPF_NAME=cpu_pg200_500
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=500
GPF_REPETITIONS=3
ACTS_BUILD_DIR="$HOME/cern/acts/build"
