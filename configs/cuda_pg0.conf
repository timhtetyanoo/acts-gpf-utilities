# PG0, all events, 3 repetitions, on the GPU.
# The build in ~/cern/acts/build_cuda decides the version: it runs whatever
# ~/cern/acts had checked out when it was built (~/cern/build_cuda.sh). Name the
# run after it; run_info.txt records the revision a run used:
#   scripts/run/run_finder.sh --config configs/cuda_pg0.conf --name cuda_v2_pg0_all
#   scripts/validation/run_validation.sh --config configs/cuda_pg0.conf --name cuda_v2_pg0_all
# Other flags bend it for one run, e.g. --events 500 (scripts/gpf_common.sh).
GPF_NAME=cuda_pg0_all
GPF_SAMPLE=PG0
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU0.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG0.json"
GPF_EVENTS=all
GPF_REPETITIONS=3
GPF_BACKEND=cuda
ACTS_BUILD_DIR="$HOME/cern/acts/build_cuda"
