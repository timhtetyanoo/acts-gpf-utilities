# Profile of the CPU finder: PG200, event 8731 alone, the slowest of the sample on the CPU (about 4 min).
# Needs the profiling build: the gpf-profiling branch built with
# -DACTS_GPF_PROFILE (see scripts/profile/analyze_profile.py).
# Step 1: scripts/run/run_finder.sh --config configs/prof_pg200_heavy.conf
# The stages land in results/prof_pg200_heavy/profile/report.txt.
GPF_NAME=prof_pg200_heavy
GPF_SAMPLE=PG200
GPF_NTUPLE="$HOME/cern/acts-gpf-utilities/data/ParticleGun_MU200.root"
GPF_GEOMETRY="$HOME/cern/acts-gpf-utilities/data/ActsTrackingGeometry_PG200.json"
GPF_EVENTS=1
GPF_FIRST_EVENT=8731
GPF_REPETITIONS=1
GPF_PROFILE=1
ACTS_BUILD_DIR="$HOME/cern/acts-example/build_prof"
